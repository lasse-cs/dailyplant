[project]
name = "wagtail-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-sesame>=3.2.3",
    "django-vite-tags",
    "wagtail-umami-analytics",
    "gunicorn>=25.3.0",
    "psycopg>=3.3.4",
    "sentry-sdk>=2.68.0",
    "wagtail>=7.4,<9.0",
    "atproto>=0.0.67",
    "markdownify>=1.2.3",
    "pymemcache>=4.0.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=7.1.0",
    "djhtml>=3.0.11",
    "honcho>=2.0.0",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
    "pytest-django>=4.14.0",
    "ruff>=0.16.2",
    "wagtail-factories>=4.4.0",
]
playwright = [
    "pytest-playwright>=0.9.0",
]


[tool.uv]
exclude-newer = "P2D"
exclude-newer-package = { django = false, wagtail = false }

[tool.uv.sources]
django-vite-tags = { git = "https://github.com/lasse-cs/django-vite-tags.git", rev = "a69aabf0c10a45bcaa0e6f9cc2f44b4d1d7548fa" }
wagtail-umami-analytics = { git = "https://github.com/lasse-cs/wagtail-umami-analytics.git", rev = "b3f39616d9ec2a120f5ab33cbac979244e13da60" }


[tool.ruff]
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# Wagtail/Django declarative class attributes (panels, parent_page_types, etc.)
# need to review
ignore = ["RUF012"]


[tool.pytest]
addopts = ["--reuse-db", "-m not e2e"]
DJANGO_SETTINGS_MODULE = "dailyplant.settings.test"
markers = ["e2e: end-to-end tests",]
pythonpath = ["src"]
python_files = ["**/tests/test_*.py"]
